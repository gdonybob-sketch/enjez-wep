<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لوحة التحكم | إنجاز</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
<button id="adminLogout" class="logout-btn">
    تسجيل الخروج
</button>
        <div class="container navbar">

            <a href="index.html" class="logo">
                إنجاز
            </a>

            <nav class="nav">

                <a href="index.html">
                    الموقع
                </a>

                <a href="services.html">
                    الخدمات
                </a>

                <a href="my-orders.html">
                    طلبات العملاء
                </a>

            </nav>

        </div>

    </header>


    <!-- Dashboard -->

    <main class="admin-section">

        <div class="container">

            <div class="admin-header">

                <div>

                    <span>
                        لوحة الإدارة
                    </span>

                    <h1>
                        إدارة الطلبات
                    </h1>

                    <p>
                        تابع طلبات العملاء وقم بتحديث حالتها.
                    </p>

                </div>

            </div>


            <!-- Statistics -->

            <div class="stats-grid">

                <div class="stat-card">

                    <span class="stat-icon">
                        📋
                    </span>

                    <div>
                        <span>
                            إجمالي الطلبات
                        </span>

                        <strong id="totalOrders">
                            0
                        </strong>
                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🟡
                    </span>

                    <div>
                        <span>
                            قيد المراجعة
                        </span>

                        <strong id="pendingOrders">
                            0
                        </strong>
                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🔵
                    </span>

                    <div>
                        <span>
                            قيد التنفيذ
                        </span>

                        <strong id="progressOrders">
                            0
                        </strong>
                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        🟢
                    </span>

                    <div>
                        <span>
                            مكتملة
                        </span>

                        <strong id="completedOrders">
                            0
                        </strong>
                    </div>

                </div>

            </div>


            <!-- Orders -->

            <section class="admin-orders">

                <div class="admin-orders-header">

                    <h2>
                        طلبات العملاء
                    </h2>

                    <button
                        class="refresh-btn"
                        id="refreshOrders">
                        تحديث
                    </button>

                </div>


                <div
                    id="adminOrdersContainer"
                    class="admin-orders-container">

                </div>

            </section>

        </div>

    </main>

<!-- Contact Messages -->

<section class="admin-messages">

    <div class="container">

        <div class="admin-section-header">

            <div>
                <span>رسائل العملاء</span>

                <h2>
                    الاستفسارات والتواصل
                </h2>
            </div>

            <button
                id="refreshMessages"
                class="btn"
            >
                تحديث الرسائل
            </button>

        </div>


        <div id="adminMessagesContainer">

            <div class="admin-empty">
                لا توجد رسائل حتى الآن.
            </div>

        </div>

    </div>

</section>
    <footer class="footer">

        <div class="container">

            <p>
                © 2026 إنجاز للخدمات. جميع الحقوق محفوظة.
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="admin.js"></script>

</body>

</html>
